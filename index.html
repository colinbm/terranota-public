<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Terra Nota</title>
<style>
  :root { color-scheme: light dark; --text: #1d1d1f; --muted: #6e6e73; --bg: #ffffff; }
  @media (prefers-color-scheme: dark) { :root { --text: #f5f5f7; --muted: #a1a1a6; --bg: #000000; } }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 17px/1.55 -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
  main { max-width: 680px; margin: 0 auto; padding: 40px 16px 64px; }
  h1 { font-size: 30px; margin: 0 0 8px; }
  .muted { color: var(--muted); }
</style>
</head>
<body>
<main>
<h1>Terra Nota</h1>
<p>An iPhone and iPad app for finding your way with any map, old or new: add a map image, match it to real places, then see where you are on it and drop pins.</p>
<p class="muted">Made by Charted Position Ltd.</p>
<p><a href="privacy/">Privacy Policy</a></p>
</main>
</body>
</html>
