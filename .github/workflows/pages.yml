# Builds the Allmaps map index and publishes it with the website on GitHub Pages.
#
# The index is deployed as a Pages artifact, not committed, so the repository
# doesn't grow by megabytes a day. Allmaps refreshes its dump at about 05:10 UTC.
name: Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "15 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Assemble site
        run: |
          mkdir -p _site/data
          cp -R index.html privacy assets .nojekyll _site/

      - name: Build map index
        run: python3 scripts/build_map_index.py _site/data/maps-index.json

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3

      - id: deployment
        uses: actions/deploy-pages@v4
